spring.application.name=placement-portal

# Server
server.port=${PORT}
server.servlet.context-path=/

# Database
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE:placement-portal}
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-prod-must-be-32-chars}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# Email Configuration - Supports both Brevo and Gmail / custom SMTP
spring.mail.host=${EMAIL_HOST:${EMAIL_HOST_BREVO:}}
spring.mail.port=${EMAIL_PORT:${EMAIL_PORT_BREVO:587}}
spring.mail.username=${EMAIL_USER:${EMAIL_USER_BREVO:}}
spring.mail.password=${EMAIL_PASS:${EMAIL_PASS_BREVO:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.default-encoding=UTF-8
app.email.from-address=${EMAIL_SENDER:${EMAIL_SENDER_BREVO:${EMAIL_FROM:}}}

# Logging
logging.level.root=INFO
logging.level.com.placementportal=${LOGGING_LEVEL_COM_PLACEMENTPORTAL:INFO}

# Admin configuration
app.admin-emails=${ADMIN_EMAILS}

# Demo data seeding
app.seed-demo-data=${SEED_DATA:false}

# AI/Groq configuration
app.ai.api-key=${AI_API_KEY}
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.model=${AI_MODEL:openai/gpt-oss-20b}

# CORS configuration
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}
